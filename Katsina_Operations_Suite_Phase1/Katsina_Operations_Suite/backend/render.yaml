services:
  - type: web
    name: katsina-operations-suite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SETUP_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TIMEZONE
        value: Africa/Lagos
